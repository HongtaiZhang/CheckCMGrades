name: Check and Download File
on:
  schedule:
    - cron: '*/15 * * * *'  # 每15分钟运行一次
  workflow_dispatch:  # 允许手动触发
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python check_and_download.py
      - name: Upload file if downloaded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: 2528079.pdf  # 替换成你的文件名
